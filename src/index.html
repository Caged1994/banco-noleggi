<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco Noleggi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<!-- STYLE -->
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="brand">
      <h1>Banco <span>Noleggi</span></h1>
      <p id="today"></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div id="banner"></div>
  <div class="goal" id="goal"></div>
  <div class="season" id="season"></div>

  <nav class="tabs" role="tablist" aria-label="Sezioni" id="tabs"></nav>

  <section class="tabp" data-tab="banco" role="tabpanel" aria-label="Banco">
    <div class="cols">
      <div class="panel">
        <div class="panel-h"><h2>Al banco</h2><span class="lbl" id="reqcount"></span></div>
        <div id="reqs" class="panel"></div>
      </div>
      <div class="panel">
        <div id="desk" class="panel"></div>
        <div id="ins" class="panel"></div>
        <div id="backempty"></div>
      </div>
    </div>
  </section>

  <section class="tabp" data-tab="flotta" role="tabpanel" aria-label="Flotta" hidden>
    <div class="panel-h"><h2>Flotta</h2><span class="lbl" id="fleetcount"></span></div>
    <div id="fleet" class="fleetgrid"></div>
  </section>

  <section class="tabp" data-tab="planning" role="tabpanel" aria-label="Planning" hidden>
    <div class="panel-h"><h2>Planning flotta</h2><span class="lbl">Prossimi 14 giorni</span></div>
    <div class="plan-wrap"><div class="plan" id="plan"></div></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Fuori a noleggio</span>
      <span><i style="background:var(--acc-bg);border:1px solid var(--accent)"></i>Prenotata</span>
      <span><i style="background:var(--warn-bg);border:1px solid var(--warn)"></i>Officina</span>
      <span><i style="background:var(--bad-bg);border:1px dashed var(--bad)"></i>Overbooking</span>
      <span><i style="background:var(--tag);opacity:.35"></i>Evento</span>
      <span><i style="background:var(--good-bg);border:2px dashed var(--good)"></i>Richiesta selezionata al banco</span>
    </div>
  </section>

  <section class="tabp" data-tab="acquisti" role="tabpanel" aria-label="Acquisti" hidden>
    <div class="panel-h"><h2>Rivenditori</h2><span class="lbl" id="mktnote"></span></div>
    <div id="market"></div>
  </section>

  <section class="tabp" data-tab="gestione" role="tabpanel" aria-label="Gestione" hidden>
    <div class="lower">
      <section class="box">
        <h2>Listino</h2>
        <span class="lbl">Prezzo al giorno per categoria</span>
        <div id="prices"></div>
      </section>
      <div class="panel">
        <section class="box">
          <h2>Personale</h2>
          <div id="staff"></div>
        </section>
        <section class="box">
          <h2>Banca</h2>
          <div id="bank"></div>
        </section>
      </div>
    </div>
  </section>

  <section class="tabp" data-tab="registro" role="tabpanel" aria-label="Registro" hidden>
    <div class="lower">
      <section class="box">
        <h2>Calendario eventi</h2>
        <div id="evlist"></div>
      </section>
      <section class="box">
        <div class="panel-h"><h2>Report settimanali</h2></div>
        <div id="replist"></div>
      </section>
      <section class="box wide">
        <div class="panel-h"><h2>Registro</h2><button id="reset" class="danger">Nuova partita</button></div>
        <div class="log" id="log"></div>
      </section>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Report settimanale"></div></div>

<div class="dock"><div class="dock-in">
  <div class="dock-sum" id="dock"></div>
  <button class="pri" id="next">Chiudi giornata →</button>
</div></div>
<!-- SCRIPT -->
</body>
</html>
